[package]
name = "cleanreach"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "CleanReach — Contact Hygiene Studio (Tauri shell over cr-core)."

[lib]
# Mobile builds require a library target (staticlib/cdylib for the
# Android/iOS loaders, rlib for the desktop binary shim).
name = "cleanreach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cleanreach"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cr-core = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true
strip = true

# The app is its own workspace root: without this, cargo sees the parent
# workspace at the repository root and refuses to build.
[workspace]
